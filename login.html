<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Homelab Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    
    <!-- Note: Backend logic for authentication would go here (e.g., form submission to Flask/Node.js) -->
</head>

<body id="login-page">

    <div class="login-box">
        <h2>Login</h2>

        <!-- Simple Example Form Structure. Needs backend validation! -->
        <form action="/api/login" method="POST">
            <input type="text" name="username" placeholder="Username"><br><br>
            
            <input type="password" name="password" placeholder="Password"><br><br>

            <!-- Submit Button that acts as an iFrame -->
            <button class="iframe-button" data-url="/dashboard.html">Login</button>
        </form>

    </div>


    <!-- Global JS -->
    <script src="/js/main.js"></script>
</body>
</html>
